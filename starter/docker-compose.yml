services:
  postgres:
    image: postgres:15-alpine
    container_name: sleapy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sleapy_neueda
      POSTGRES_DB: sleapy_db
    ports:
      - "8101:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize operational schema (tables, indexes, FK constraints)
      - ./database/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql
      # Initialize analyst schema (analytics tables for ETL pipeline)
      - ./database/analystSchema.sql:/docker-entrypoint-initdb.d/02-analyst-schema.sql
      # Mock data for development/testing
      - ./database/mockdata.sql:/docker-entrypoint-initdb.d/03-mockdata.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sleapy-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sleapy.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sleapy-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sleapy-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"

volumes:
  postgres_data:
  pgadmin_data: