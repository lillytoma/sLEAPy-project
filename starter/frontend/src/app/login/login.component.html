<app-marketing-shell>
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-14 items-center">

    <!-- Marketing copy (left) -->
    <div class="flex flex-col gap-6">
      <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold w-fit" style="background-color:var(--muted);color:var(--primary)">
        <span class="status-dot"></span> Markets live
      </span>
      <h1 class="font-serif font-bold" style="font-size:clamp(34px, 4.5vw, 56px); line-height:1.08; letter-spacing:-0.01em;">
        Welcome to <span style="color:var(--primary)">sLEAPy</span> Stocks
      </h1>
      <p class="italic" style="color:var(--muted-foreground); font-family:var(--font-body); font-size:18px;">
        "trading made so easy you can do it in your sLEAP"
      </p>
    </div>

    <!-- Login card (right) -->
    <div class="panel p-8 w-full max-w-md md:ml-auto">
      <h2 class="font-serif text-2xl font-bold" style="color:var(--foreground)">Welcome back</h2>
      <p class="mt-1 text-sm" style="color:var(--muted-foreground)">Sign in to your sLEAPy Stocks account</p>

      @if (loginError()) {
        <div class="mt-6 px-4 py-3 rounded-md text-sm flex items-start gap-2" style="background-color:var(--error);color:#fff">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="flex-shrink-0 mt-0.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ loginErrorMessage() || 'Invalid email or password.' }}</span>
        </div>
      }

      <form (ngSubmit)="doLogin()" class="space-y-5 mt-6">
        <div>
          <label class="block text-sm font-semibold mb-1.5" style="color:var(--foreground)">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required
            placeholder="you@example.com"
            class="w-full px-4 py-2.5 rounded-md text-sm border outline-none transition-all"
            style="background-color:var(--background);color:var(--foreground);border-color:var(--border)" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-sm font-semibold" style="color:var(--foreground)">Password</label>
            <span class="text-xs font-semibold" style="color:var(--muted-foreground)" title="Password reset isn't available yet">Forgot?</span>
          </div>
          <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password" required
              placeholder="••••••••"
              class="w-full px-4 py-2.5 pr-10 rounded-md text-sm border outline-none transition-all"
              style="background-color:var(--background);color:var(--foreground);border-color:var(--border)" />
            <button type="button" (click)="showPassword.set(!showPassword())"
              class="absolute right-3 top-1/2 -translate-y-1/2"
              style="color:var(--muted-foreground)">
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>
        <button type="submit" class="button button-primary w-full" style="padding:13px;font-size:14px;" [disabled]="isLoading()">
          {{ isLoading() ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm">
        <a routerLink="/" class="font-semibold" style="color:var(--muted-foreground)">← Back to homepage</a>
      </p>
    </div>
  </div>
</app-marketing-shell>
