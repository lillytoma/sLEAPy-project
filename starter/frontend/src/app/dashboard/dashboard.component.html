 <div class="flex h-screen overflow-hidden" style="background-color:var(--background);color:var(--foreground)">
      <!-- Mobile overlay -->
      @if (sidebarOpen()) {
        <div class="fixed inset-0 z-20 lg:hidden"
          style="background-color:rgba(0,0,0,0.5)"
          (click)="sidebarOpen.set(false)"></div>
      }

      <!-- Sidebar -->
      <aside class="fixed inset-y-0 left-0 z-30 flex flex-col w-64 transition-transform duration-300 lg:relative lg:translate-x-0"
        [style.transform]="sidebarOpen() || isDesktop() ? 'translateX(0)' : 'translateX(-100%)'"
        style="background-color:var(--card);border-right:1px solid var(--border)">
        <!-- Logo -->
        <div class="flex items-center justify-between px-6 py-5 border-b" style="border-color:var(--border)">
          <span class="font-serif text-xl font-bold" style="color:var(--primary)">sLEAPy Stocks</span>
          <button class="lg:hidden p-1" (click)="sidebarOpen.set(false)" style="color:var(--muted-foreground)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Nav items -->
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
          @for (item of navItems; track item.route) {
            <a [routerLink]="item.route" routerLinkActive="nav-active"
              (click)="sidebarOpen.set(false)"
              class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition-colors"
              style="color:var(--muted-foreground)">
              <span class="text-lg">{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </a>
          }
        </nav>

        <!-- Bottom user info -->
        <div class="px-4 py-4 border-t" style="border-color:var(--border)">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold"
              style="background-color:var(--primary);color:var(--primary-foreground)">D</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate" style="color:var(--foreground)">Demo User</p>
              <p class="text-xs truncate" style="color:var(--muted-foreground)">demo&#64;sleapystocks.com</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main content -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Top bar -->
        <header class="flex items-center justify-between px-6 py-4 border-b flex-shrink-0"
          style="background-color:var(--card);border-color:var(--border)">
          <div class="flex items-center gap-4">
            <!-- Hamburger (mobile) -->
            <button class="lg:hidden p-1.5 rounded-md" (click)="sidebarOpen.set(true)"
              style="color:var(--foreground)">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <h1 class="text-lg font-semibold" style="color:var(--foreground)">{{ pageTitle() }}</h1>
          </div>

          <div class="flex items-center gap-3">
            <!-- Dark mode toggle -->
            <button (click)="themeService.toggleDark()"
              class="p-2 rounded-full border transition-colors"
              style="border-color:var(--border);color:var(--foreground)">
              @if (themeService.dark()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                  <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
              }
            </button>

            <!-- Sign out -->
            <button (click)="signOut()"
              class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium border transition-colors"
              style="border-color:var(--border);color:var(--muted-foreground)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              <span class="hidden sm:inline">Sign Out</span>
            </button>
          </div>
        </header>

        <!-- Page content -->
        <main class="flex-1 overflow-y-auto p-6">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>

    <style>
      .nav-active {
        background-color: var(--primary) !important;
        color: var(--primary-foreground) !important;
      }
    </style>
