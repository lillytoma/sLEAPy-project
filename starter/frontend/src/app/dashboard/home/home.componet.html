<div class="flex flex-col items-center justify-center min-h-screen" style="background-color: var(--background); color: var(--foreground)">
  <div class="text-center">
    <div class="mb-6 flex justify-center">
      <div class="flex items-center justify-center w-20 h-20 rounded-full" style="background-color: var(--primary); color: white">
        <span class="text-3xl font-bold">{{ authService.userInitials() }}</span>
      </div>
    </div>
    
    <h1 class="text-3xl font-bold mb-2">Welcome, {{ authService.userName() }}!</h1>
    <p class="text-muted-foreground mb-8">Successfully logged in to your dashboard</p>
    
    <button 
      (click)="logout()"
      class="px-6 py-2 rounded-lg font-medium transition-colors"
      style="background-color: var(--primary); color: white"
      onmouseover="this.style.opacity='0.9'"
      onmouseout="this.style.opacity='1'">
      Logout
    </button>
  </div>
</div>
