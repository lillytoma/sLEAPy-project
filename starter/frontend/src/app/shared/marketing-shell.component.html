<div style="background-color:var(--background);color:var(--foreground);min-height:100vh;">

  <!-- Ticker tape -->
  <div class="overflow-hidden border-b scrollbar-hide" style="border-color:var(--border);background-color:var(--card);">
    <div class="flex ticker-track" style="width:max-content;">
      @for (stock of tickerStocks; track $index) {
        <div class="flex items-center gap-2 px-5 py-2 whitespace-nowrap font-mono text-xs">
          <span class="font-bold" style="color:var(--foreground)">{{ stock.symbol }}</span>
          <span style="color:var(--foreground)">${{ stock.price.toFixed(2) }}</span>
          <span [style.color]="stock.chg >= 0 ? 'var(--success)' : 'var(--error)'">{{ stock.chg >= 0 ? '+' : '' }}{{ stock.chg.toFixed(2) }}%</span>
        </div>
      }
    </div>
  </div>

  <!-- Navbar -->
  <header class="flex items-center justify-between px-6 md:px-10 py-4 border-b" style="border-color:var(--border);background-color:var(--card);">
    <a routerLink="/" class="flex items-center gap-2.5" aria-label="sLEAPy home">
      <app-frog-mascot [size]="36" />
      <span class="font-serif text-xl font-bold" style="color:var(--foreground)">sLEAPy Stocks</span>
    </a>
    <button (click)="themeService.toggleDark()"
      class="p-2.5 rounded-full outlined"
      style="background-color:var(--background);border-color:var(--border);color:var(--foreground)"
      [title]="themeService.dark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (themeService.dark()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>
  </header>

  <!-- Page-specific hero content, laid over the grid background -->
  <main class="px-6 py-20 md:py-28"
    style="background-image: linear-gradient(to right, var(--border) 1px, transparent 1px), linear-gradient(to bottom, var(--border) 1px, transparent 1px); background-size: 48px 48px;">
    <ng-content></ng-content>
  </main>
</div>
