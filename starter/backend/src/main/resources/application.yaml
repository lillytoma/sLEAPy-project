spring:
  application:
    name: project
  datasource:
    url: jdbc:postgresql://localhost:8101/${POSTGRES_DB:sleapy_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
