spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# MyBatis configuration for testing
mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test_secret_key_for_jwt_signing_which_is_long_enough_32_chars
  expiration: 86400000