AWSTemplateFormatVersion: '2010-09-09'
Description: sLEAPy low-cost demo - CloudFront/S3, ALB/ECS Fargate, private PostgreSQL RDS

Parameters:
  AppDatabaseName:
    Type: String
    Default: sleapy_db
    AllowedPattern: '[a-z][a-z0-9_]{0,62}'
  ImageTag:
    Type: String
    Default: bootstrap
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  CloudFrontPrefixList:
    Type: String
  PostgresVersion:
    Type: String
    Default: '17.5'

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.82.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: sLEAPy}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: sLEAPy}]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.82.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: sLEAPy-public-a}]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.82.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: sLEAPy-public-b}]
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.82.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: sLEAPy-database-a}]
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.82.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: sLEAPy-database-b}]
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicA
      RouteTableId: !Ref PublicRoutes
  PublicBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicB
      RouteTableId: !Ref PublicRoutes
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: sLEAPy - only CloudFront origin-facing servers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: sLEAPy - backend only from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: sLEAPy - PostgreSQL only from ECS tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: sLEAPy private database subnets
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: sLEAPy database credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"sleapy"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: sLEAPy JWT signing key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: sLEAPy CloudFront to ALB shared header
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-postgres'
      DBName: sleapy_db
      Engine: postgres
      EngineVersion: !Ref PostgresVersion
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      Tags: [{Key: Team, Value: sLEAPy}]
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}/backend'
      EmptyOnDelete: true
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last five images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'
  PricesRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}/prices'
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last five images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'
  SeedRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}/database'
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last five images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 7
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: sLEAPy-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseSecret, !Ref JwtSecret]
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Name: !Ref AWS::StackName
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8081
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}
  CloudFrontListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-sLEAPy-Origin
            Values: [!Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      Tags: [{Key: Team, Value: sLEAPy}]
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa'
      AutoPublish: true
      FunctionConfig:
        Comment: sLEAPy Angular deep links without masking API errors
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.endsWith('/') || !request.uri.split('/').pop().includes('.')) {
            request.uri = '/index.html';
          }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: sLEAPy demo
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: backend
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig: {HTTPPort: 80, OriginProtocolPolicy: http-only}
            OriginCustomHeaders:
              - HeaderName: X-sLEAPy-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouting.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: backend
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /ws/*
            TargetOriginId: backend
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt FrontendBucket.Arn, !Sub '${FrontendBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
  AppTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      Cpu: '512'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: backend
          Image: !Sub '${BackendRepository.RepositoryUri}:${ImageTag}'
          Essential: true
          Memory: 1536
          PortMappings: [{ContainerPort: 8081}]
          Environment:
            - {Name: POSTGRES_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: POSTGRES_PORT, Value: '5432'}
            - {Name: POSTGRES_DB, Value: !Sub '${AppDatabaseName}?sslmode=require'}
            - {Name: POSTGRES_USER, Value: sleapy}
            - {Name: PRICE_SERVICE_URL, Value: 'http://127.0.0.1:8000'}
            - {Name: APP_ALLOWED_ORIGINS, Value: !Sub 'https://${Distribution.DomainName}'}
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub '${DatabaseSecret}:password::'
            - Name: JWT_SECRET
              ValueFrom: !Ref JwtSecret
          DependsOn: [{ContainerName: prices, Condition: HEALTHY}]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
        - Name: prices
          Image: !Sub '${PricesRepository.RepositoryUri}:${ImageTag}'
          Essential: true
          Memory: 512
          HealthCheck:
            Command: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  SeedTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-database-init'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: database
          Image: !Sub '${SeedRepository.RepositoryUri}:${ImageTag}'
          Essential: true
          Environment:
            - {Name: PGHOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: PGPORT, Value: '5432'}
            - {Name: PGDATABASE, Value: !Ref AppDatabaseName}
            - {Name: PGUSER, Value: sleapy}
            - {Name: PGSSLMODE, Value: require}
          Secrets:
            - Name: PGPASSWORD
              ValueFrom: !Sub '${DatabaseSecret}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: seed
  Service:
    Type: AWS::ECS::Service
    DependsOn: [CloudFrontListenerRule, InternetRoute, PublicARoutes, PublicBRoutes]
    Properties:
      ServiceName: !Ref AWS::StackName
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AppTask
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicA, !Ref PublicB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8081
          TargetGroupArn: !Ref TargetGroup

Outputs:
  AppDatabaseName:
    Value: !Ref AppDatabaseName
  WebsiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  FrontendBucket:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  BackendRepository:
    Value: !GetAtt BackendRepository.RepositoryUri
  PricesRepository:
    Value: !GetAtt PricesRepository.RepositoryUri
  SeedRepository:
    Value: !GetAtt SeedRepository.RepositoryUri
  Cluster:
    Value: !Ref Cluster
  Service:
    Value: !GetAtt Service.Name
  SeedTask:
    Value: !Ref SeedTask
  PublicSubnet:
    Value: !Ref PublicA
  TaskSecurityGroup:
    Value: !Ref TaskSecurityGroup
  Database:
    Value: !Ref Database
  LogGroup:
    Value: !Ref Logs
